[package]
name = "spotify-helper"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Private Puros helper that prepares one Spotify track through librespot"

[[bin]]
name = "spotify_helper"
path = "src/main.rs"

[dependencies]
librespot-core = { version = "=0.8.0", default-features = false, features = ["native-tls"] }
librespot-audio = { version = "=0.8.0", default-features = false, features = ["native-tls"] }
librespot-metadata = { version = "=0.8.0", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "fs", "signal", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
